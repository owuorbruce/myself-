name: Build Slate for Windows
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'server/**'
      - 'desktop/**'
      - 'public/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'electron-builder.config.cjs'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: slate-windows-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Set desktop version
        run: node desktop/set-version.mjs
      - name: Build Windows installer
        run: npm run package:windows
      - name: Install and test the actual Windows app
        shell: pwsh
        run: |
          $install = Join-Path $env:RUNNER_TEMP 'SlateInstalled'
          $setup = Join-Path $pwd 'release/Slate-Setup.exe'
          $result = Start-Process -FilePath $setup -ArgumentList '/S', "/D=$install" -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Installer failed: $($result.ExitCode)" }
          $executable = Join-Path $install 'Slate.exe'
          if (!(Test-Path $executable)) { $executable = Join-Path $env:LOCALAPPDATA 'Programs/Slate/Slate.exe' }
          if (!(Test-Path $executable)) { throw 'Installed Slate.exe was not found.' }
          $expected = (Get-FileHash 'release/win-unpacked/Slate.exe' -Algorithm SHA256).Hash
          if ((Get-FileHash $executable -Algorithm SHA256).Hash -ne $expected) { throw 'Installed executable differs from the packaged build.' }
          $env:SLATE_SMOKE_DIR = Join-Path $pwd 'desktop-smoke'
          node desktop/check-package.mjs $executable
          if ($LASTEXITCODE -ne 0) { throw 'Installed app smoke checks failed.' }
      - name: Record installer checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash 'release/Slate-Setup.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Slate-Setup.exe" | Set-Content 'release/Slate-Setup.exe.sha256' -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: Slate-Windows
          path: |
            release/Slate-Setup.exe
            release/Slate-Setup.exe.sha256
            desktop-smoke/*.json
          retention-days: 30
      - name: Publish verified Windows download
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const version = JSON.parse(fs.readFileSync('desktop/package.json', 'utf8')).version;
            const tag = `desktop-v${version}`;
            const {owner, repo} = context.repo;
            const releases = await github.rest.repos.listReleases({owner, repo, per_page: 100});
            let release = releases.data.find(r => r.tag_name === tag);
            const body = 'Install Slate-Setup.exe, then open Slate from your desktop or Start menu. Node.js and a manual localhost launcher are not required.\n\nBring existing browser notes across with a workspace backup. Close any old Slate launcher before opening the desktop app. Your saved local ChatGPT connection can be reused.\n\nThe installed app passed Windows smoke checks for its window, local helper, renderer isolation, settings, save on close and notes after restart. This installer is unsigned. ChatGPT needs an internet connection and an eligible account.';
            if (!release) release = (await github.rest.repos.createRelease({owner, repo, tag_name: tag, target_commitish: context.sha, name: `Slate for Windows ${version}`, body, draft: true, prerelease: false})).data;
            for (const name of ['Slate-Setup.exe', 'Slate-Setup.exe.sha256']) {
              const prior = release.assets.find(a => a.name === name);
              if (prior) await github.rest.repos.deleteReleaseAsset({owner, repo, asset_id: prior.id});
              const data = fs.readFileSync(`release/${name}`);
              await github.rest.repos.uploadReleaseAsset({owner, repo, release_id: release.id, name, data, headers: {'content-type': 'application/octet-stream', 'content-length': data.length}});
            }
            await github.rest.repos.updateRelease({owner, repo, release_id: release.id, draft: false, make_latest: 'true', body});
